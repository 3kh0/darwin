services:
  esmbot-media:
    image: ghcr.io/esmbot/esmbot:edge
    entrypoint: ["node", "dist/api/index.js"]
    command: []
    environment:
      - PORT=3762
      - PASS=${ESMBOT_PASS:-dev-secret}
    ports:
      - "3762:3762"
    volumes:
      - ./services/esmbot-config:/app/config:ro
    restart: unless-stopped
