services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ESMBOT_WS_URL=ws://esmbot-media:3762/sock
      - ESMBOT_HTTP_URL=http://esmbot-media:3762
      - ESMBOT_PASS=${ESMBOT_PASS:?ESMBOT_PASS is required}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      - API_KEYS=${API_KEYS:-}
      - MEDIA_SECRET=${MEDIA_SECRET:-}
    depends_on:
      - esmbot-media
    volumes:
      - web-data:/app/.data
    expose:
      - "3000"

  esmbot-media:
    build:
      context: ./services/esmbot-media
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3762
      - PASS=${ESMBOT_PASS:?ESMBOT_PASS is required}
    expose:
      - "3762"

volumes:
  web-data:
